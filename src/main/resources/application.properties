spring.application.name=social-analytics
server.port=${SERVER_PORT:8080}
spring.profiles.default=local

# ---------- Datasource (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/social_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
spring.security.oauth2.client.registration.twitter.client-name=X (Twitter)
spring.security.oauth2.client.registration.twitter.provider=twitter
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.twitter.scope=users.read,tweet.read
spring.security.oauth2.client.provider.twitter.authorization-uri=https://x.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.x.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.x.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=data

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Swagger UI gui kem header X-XSRF-TOKEN (doc tu cookie XSRF-TOKEN) cho POST/PUT/DELETE
springdoc.swagger-ui.csrf.enabled=true

# ---------- Logging (see logback-spring.xml) ----------
logging.level.com.example.socialanalytics=DEBUG
logging.file.name=logs/social-analytics.log
