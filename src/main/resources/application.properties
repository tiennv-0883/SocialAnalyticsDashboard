spring.application.name=social-analytics
server.port=${SERVER_PORT:8080}

# ---------- Datasource (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/social_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging (see logback-spring.xml) ----------
logging.level.com.example.socialanalytics=DEBUG
logging.file.name=logs/social-analytics.log
