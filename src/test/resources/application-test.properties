spring.datasource.url=jdbc:h2:mem:social_analytics;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.security.oauth2.client.registration.facebook.client-id=test-facebook-id
spring.security.oauth2.client.registration.facebook.client-secret=test-facebook-secret
spring.security.oauth2.client.registration.twitter.client-id=test-twitter-id
spring.security.oauth2.client.registration.twitter.client-secret=test-twitter-secret
app.jobs.update-metrics.cron=-
app.jobs.update-metrics.chunk-size=2
app.social-api.mock.enabled=true
app.social-api.mock.latency-ms=0
app.jobs.metrics-retention.cron=-
app.social-api.mock.failure-rate=0
app.jms.import-completed.redelivery-delay-ms=50
app.chart.zone=UTC
